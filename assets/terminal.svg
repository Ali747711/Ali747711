<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Terminal: shipping vector search, streaming assistants and cost guardrails to production">
<title>zsh - azamat@seoul</title>
<defs>
<clipPath id="tm-cmd"><rect class="tm-wipe" x="242" y="66" width="256" height="24"/></clipPath>
<clipPath id="tm-bar"><rect class="tm-fill" x="40" y="104" width="1040" height="10"/></clipPath>
<radialGradient id="tm-glow" cx="22%" cy="45%" r="55%">
<stop offset="0" stop-color="#A3E635" stop-opacity=".10"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
</radialGradient>
</defs>
<style>
text{font-family:ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
@keyframes tmwipe{from{transform:translateX(-256px)}to{transform:translateX(0)}}
@keyframes tmcar{from{transform:translateX(-250px)}to{transform:translateX(0)}}
@keyframes tmbar{from{transform:translateX(-1040px)}to{transform:translateX(0)}}
@keyframes tmin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes tmbl{0%,52%{opacity:1}53%,100%{opacity:.08}}
@keyframes tmpu{0%,100%{opacity:1}50%{opacity:.55}}

.tm-wipe{animation:tmwipe 1.1s steps(26,end) .3s both}
.tm-car1{animation:tmcar 1.1s steps(26,end) .3s both, tmbl 1.15s steps(1) 1.4s 3}
.tm-fill{animation:tmbar 1.5s cubic-bezier(.4,.9,.3,1) 1.45s both}
.pr1{animation:tmin .25s ease-out 0s both}
.lg1{animation:tmin .3s ease-out 1.6s both}
.lg2{animation:tmin .3s ease-out 1.95s both}
.lg3{animation:tmin .3s ease-out 2.3s both}
.sum{animation:tmin .35s ease-out 2.75s both}
.pr2{animation:tmin .3s ease-out 3.15s both}
.tm-car2{animation:tmin .3s ease-out 3.15s both, tmbl 1.15s steps(1) 3.45s infinite}
.glow{animation:tmpu 8s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
.tm-wipe,.tm-car1,.tm-fill,.pr1,.lg1,.lg2,.lg3,.sum,.pr2,.tm-car2,.glow{animation:none}
}
</style>

<rect width="1200" height="320" fill="#0A0F0B"/>
<rect class="glow" width="1200" height="320" fill="url(#tm-glow)"/>

<rect width="1200" height="42" fill="#121A14"/>
<rect x="0" y="42" width="1200" height="1" fill="#7A8B7F" fill-opacity=".22"/>
<text x="24" y="27" font-size="12" fill="#E6F0E8" textLength="58" lengthAdjust="spacingAndGlyphs">TERMINAL</text><rect x="24" y="36" width="58" height="2" fill="#A3E635"/><text x="115.6" y="27" font-size="12" fill="#7A8B7F" textLength="58" lengthAdjust="spacingAndGlyphs" opacity=".6">PROBLEMS</text><text x="207.2" y="27" font-size="12" fill="#7A8B7F" textLength="43" lengthAdjust="spacingAndGlyphs" opacity=".6">OUTPUT</text><text x="284.4" y="27" font-size="12" fill="#7A8B7F" textLength="36" lengthAdjust="spacingAndGlyphs" opacity=".6">PORTS</text>
<circle cx="1068" cy="21" r="4" fill="#22C55E"/>
<text x="1176" y="26" font-size="12" fill="#7A8B7F" text-anchor="end" textLength="86" lengthAdjust="spacingAndGlyphs" opacity=".8">zsh - azamat</text>

<g class="pr1"><text x="40" y="82" font-size="16" fill="#A3E635" textLength="192" lengthAdjust="spacingAndGlyphs">azamat@seoul ~/dev %</text></g>
<g clip-path="url(#tm-cmd)"><text x="241.6" y="82" font-size="16" fill="#E6F0E8" textLength="250" lengthAdjust="spacingAndGlyphs">./ship --target production</text></g>
<rect class="tm-car1" x="495" y="68" width="9" height="18" fill="#A3E635"/>

<rect x="40" y="104" width="1040" height="10" rx="5" fill="#121A14"/>
<g clip-path="url(#tm-bar)"><rect x="40" y="104" width="1040" height="10" rx="5" fill="#A3E635" opacity=".85"/></g>
<text x="1176" y="113" font-size="12" fill="#15803D" text-anchor="end" textLength="29" lengthAdjust="spacingAndGlyphs">100%</text>

<g class="lg1"><rect x="64" y="141" width="7" height="7" fill="#A3E635"/><text x="96" y="151" font-size="16" fill="#E6F0E8" textLength="125" lengthAdjust="spacingAndGlyphs">vector search</text><text x="372" y="151" font-size="16" fill="#7A8B7F" textLength="250" lengthAdjust="spacingAndGlyphs">mongodb atlas vector index</text><path d="M760 146l4 5 8-10" fill="none" stroke="#A3E635" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="784" y="151" font-size="16" fill="#A3E635" textLength="19" lengthAdjust="spacingAndGlyphs">ok</text></g><g class="lg2"><rect x="64" y="171" width="7" height="7" fill="#A3E635"/><text x="96" y="181" font-size="16" fill="#E6F0E8" textLength="182" lengthAdjust="spacingAndGlyphs">streaming assistant</text><text x="372" y="181" font-size="16" fill="#7A8B7F" textLength="173" lengthAdjust="spacingAndGlyphs">sse + tool calling</text><path d="M760 176l4 5 8-10" fill="none" stroke="#A3E635" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="784" y="181" font-size="16" fill="#A3E635" textLength="19" lengthAdjust="spacingAndGlyphs">ok</text></g><g class="lg3"><rect x="64" y="201" width="7" height="7" fill="#A3E635"/><text x="96" y="211" font-size="16" fill="#E6F0E8" textLength="144" lengthAdjust="spacingAndGlyphs">cost guardrails</text><text x="372" y="211" font-size="16" fill="#7A8B7F" textLength="211" lengthAdjust="spacingAndGlyphs">redis daily budget cap</text><path d="M760 206l4 5 8-10" fill="none" stroke="#A3E635" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="784" y="211" font-size="16" fill="#A3E635" textLength="19" lengthAdjust="spacingAndGlyphs">ok</text></g>

<g class="sum">
<path d="M64 243l5 6 10-13" fill="none" stroke="#22C55E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="96" y="249" font-size="16" fill="#D9F99D" textLength="710" lengthAdjust="spacingAndGlyphs">shipped  ·  clients in 4 countries  ·  2,000+ SKUs  ·  560-product catalog</text>
</g>

<g class="pr2"><text x="40" y="288" font-size="16" fill="#A3E635" textLength="192" lengthAdjust="spacingAndGlyphs">azamat@seoul ~/dev %</text></g>
<rect class="tm-car2" x="242" y="274" width="9" height="18" fill="#A3E635"/>
</svg>
