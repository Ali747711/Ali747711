<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Azamat (Ali) Nabiev - Full-Stack Developer / AI Engineer / Seoul, South Korea">
<title>Azamat (Ali) Nabiev</title>
<defs>
<radialGradient id="pine" cx="16%" cy="62%" r="58%">
<stop offset="0" stop-color="#15803D" stop-opacity=".24"/><stop offset="1" stop-color="#15803D" stop-opacity="0"/>
</radialGradient>
<radialGradient id="lime" cx="31%" cy="49%" r="30%">
<stop offset="0" stop-color="#A3E635" stop-opacity=".13"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
</radialGradient>
<clipPath id="typeClip"><rect class="tw" x="160" y="110" width="604" height="64"/></clipPath>
</defs>
<style>
text{font-family:ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
.k{fill:#22C55E}.s{fill:#A3E635}.p{fill:#D9F99D}.c{fill:#7A8B7F}.b{fill:#E6F0E8}.d{fill:#E6F0E8;opacity:.5}
.m{fill:#7A8B7F;opacity:.28}.ml{fill:#A3E635;opacity:.5}.mg{fill:#22C55E;opacity:.38}
/* every reveal is FINITE with fill:both and a fully-visible default state,
   so reduced-motion and frame-0 screenshot capture both show the finished art */
@keyframes bl{0%,52%{opacity:1}53%,100%{opacity:.1}}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes sl{0%,100%{transform:translateY(0)}50%{transform:translateY(22px)}}
@keyframes wipe{from{transform:translateX(-604px)}to{transform:translateX(0)}}
@keyframes travel{from{transform:translateX(-580px)}to{transform:translateX(0)}}
@keyframes rv{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes lit{from{fill:#7A8B7F}to{fill:#A3E635}}
@keyframes band{from{opacity:0}to{opacity:.05}}

.glow{animation:pu 7s ease-in-out infinite}
.vp{animation:sl 11s ease-in-out infinite}

.tw{animation:wipe 1.45s steps(21,end) .95s both}
.car{animation:travel 1.45s steps(21,end) .95s both, bl 1.15s steps(1) 2.45s infinite}
.hl{animation:band .3s ease-out .9s both}
.ln3{animation:lit .25s ease-out 1s both}

.r1{animation:rv .38s ease-out 0s both}
.r2{animation:rv .38s ease-out .38s both}
.r3{animation:rv .3s ease-out .72s both}
.r4{animation:rv .38s ease-out 2.42s both}
.r5{animation:rv .38s ease-out 2.8s both}

@media (prefers-reduced-motion:reduce){
.glow,.vp,.tw,.car,.hl,.ln3,.r1,.r2,.r3,.r4,.r5{animation:none}
.hl{opacity:.05}.ln3{fill:#A3E635}
}
</style>

