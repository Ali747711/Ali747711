name: Generate Snake

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A3E635&color_dots=#121A14,#15803D,#22C55E,#A3E635,#D9F99D
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#15803D&color_dots=#ECFCCB,#D9F99D,#A3E635,#22C55E,#15803D

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
